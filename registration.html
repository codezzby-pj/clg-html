<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="form.css">
</head>
<body>
    <header>Farmer Registration Form</header>
    <fieldset>
    <legend>Registration Form</legend>
    <form >
    <label>Name:</label>
    <input class="n" type = "text" name = "name" placeholder = "Enter your name" required>
    <br>
    <br>
    <label>Plot ID:</label>
    <input class="n" type = "number" name = "plot_id" placeholder = "Enter your Plot ID" required> <br>
    <br>
    <br>
    <label>Phone No:</label>
    <input class="n" type = "number" name = "phone_no" placeholder = "Enter your Phone No" required> <br>
    <br>
    <br>
    <label>Email:</label>
    <input class="n" type = "email" name = "email" placeholder = "Enter your Email" required> <br>
    <br> 
    <br>
    <label>Address:</label>
    <textarea class="address" rows = "5" cols = "50" name = "description" placeholder = "Enter your address" required>
    </textarea>
    <br>
    <br>
    <label>Village:</label>
    <input class="n" type = "text" name = "Village" placeholder = "Enter your village name" required>
    <br>
    <br>
    <label>Crop Stage:</label>
    <input class="n" type = "text" name = "Crop_stage" placeholder = "Enter crop stage" required>
    <br>
    <br>
    <label>Soil Type:</label>
    <input class="n" type = "text" name = "Soil_type" placeholder = "Enter soil type" required>
    <br>
    <br>
    <label>Irrigation Method:</label>
    <input class="n" type = "text" name = "Irrigation_method" placeholder = "Enter irrigation method" required>
    <br>
    <br>
    <label>Date:</label>
    <input class="n" type = "Date" name = "date" placeholder = "Enter date" required>
    <br>
    <br>
    <label>Upload Farm Photo:</label>
    <input class="n" type = "file" name = "file" placeholder = "Upload farm photo" required> 
    <br>
    <br>
    <label>How many sugarcame fields You have?:</label>
    <input class="sugarcane_fields" type = "radio" name = "Sugarcane" value = "on"> 1
    <input class="more_than_1" type = "radio" name = "more than 1" value = "on"> more than 1
    <br>
    <br>
    <button type = "submit" name = "submit">Submit</button>
    <!-- Mobile Number
    ● Email
    ● Plot ID
    ● Village
    ● Crop Stage
    ● Soil Type
    ● Irrigation Method
    ● Date
    ● File Upload (Farm Photo) -->
    </form>
    </body>
    </html>
