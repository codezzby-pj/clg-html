<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #7cb48a;
            text-align: center;
        }

        h1 {
            color: #24566b;
            margin: 30px 0;
            font-size: 32px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 10px 40px 40px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #aaa;
            width: 45%;
        }

        .card h2 {
            color: #356b7d;
            margin-top: 0;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 10px;
        }

        .card:hover {
            transform: translateY(-5px);
            transition: 0.3s;
        }

        /* Soil moisture result box */
        #sensorResults {
            background-color: white;
            width: 70%;
            margin: 20px auto 40px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #aaa;
            text-align: left;
        }

        #sensorResults h2 {
            text-align: center;
            color: #356b7d;
        }

        #sensorResults p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🌤️ Mumbai Weather</h1>

    <div class="container">

        <div class="card">

            <h2>📍 Mumbai Location</h2>

            <iframe src="https://www.google.com/maps?q=Mumbai&output=embed">
            </iframe>

        </div>


        <div class="card">

            <h2>🌦️ Weather Forecast</h2>

            <iframe src="https://www.accuweather.com/en/in/india-weather">
            </iframe>

        </div>

    </div>


    <!-- Soil Moisture Sensor Results -->

    <div id="sensorResults">

        <h2>🌱 Soil Moisture Sensor Readings</h2>

        <p>
            <b>All Sensor Readings:</b>
            <span id="allReadings"></span>
        </p>

        <p>
            <b>Minimum Moisture Level:</b>
            <span id="minimumMoisture"></span>%
        </p>

        <p>
            <b>Maximum Moisture Level:</b>
            <span id="maximumMoisture"></span>%
        </p>

        <p>
            <b>Average Soil Moisture:</b>
            <span id="averageMoisture"></span>%
        </p>

        <p>
            <b>Critical Value:</b>
            <span id="criticalValue"></span>%
        </p>

        <p>
            <b>Number of Readings Below Critical Value:</b>
            <span id="belowCritical"></span>
        </p>

    </div>


    <script>

        // Array containing hourly soil moisture readings
        let soilMoistureReadings = [25, 35, 42, 28, 50, 32, 27, 45];

        // Critical soil moisture value
        let criticalValue = 30;

        // 1. Display all sensor readings
        document.getElementById("allReadings").innerHTML =
            soilMoistureReadings.join("%, ") + "%";


        // 2. Find minimum moisture level
        let minimumMoisture = soilMoistureReadings[0];

        for (let i = 1; i < soilMoistureReadings.length; i++) {

            if (soilMoistureReadings[i] < minimumMoisture) {
                minimumMoisture = soilMoistureReadings[i];
            }

        }


        // 3. Find maximum moisture level
        let maximumMoisture = soilMoistureReadings[0];

        for (let i = 1; i < soilMoistureReadings.length; i++) {

            if (soilMoistureReadings[i] > maximumMoisture) {
                maximumMoisture = soilMoistureReadings[i];
            }

        }


        // 4. Calculate average soil moisture
        let totalMoisture = 0;

        for (let i = 0; i < soilMoistureReadings.length; i++) {

            totalMoisture = totalMoisture + soilMoistureReadings[i];

        }

        let averageMoisture =
            totalMoisture / soilMoistureReadings.length;


        // 5. Count readings below critical value
        let belowCritical = 0;

        for (let i = 0; i < soilMoistureReadings.length; i++) {

            if (soilMoistureReadings[i] < criticalValue) {
                belowCritical++;
            }

        }


        // Display results on webpage
        document.getElementById("minimumMoisture").innerHTML =
            minimumMoisture;

        document.getElementById("maximumMoisture").innerHTML =
            maximumMoisture;

        document.getElementById("averageMoisture").innerHTML =
            averageMoisture.toFixed(2);

        document.getElementById("criticalValue").innerHTML =
            criticalValue;

        document.getElementById("belowCritical").innerHTML =
            belowCritical;

    </script>

</body>

</html>
